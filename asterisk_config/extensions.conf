; =====================================================================
; SH-105 — Dialplan (extensions.conf) for Asterisk
; =====================================================================
; Routes calls to extension 3532 ("DHAN" on a phone keypad) to
; the SH-105 AudioSocket backend.
;
; Place this file at /etc/asterisk/extensions.conf
; =====================================================================

[general]
static=yes
writeprotect=no

[globals]
; The IP:port where the SH-105 AudioSocket server is listening.
; Change this if the backend runs on a different machine.
SH105_AUDIOSOCKET_HOST=host.docker.internal
SH105_AUDIOSOCKET_PORT=9092

[sh105]
; ── Extension 3532 ("DHAN") — connects to the AI agent ───────────────
exten => 3532,1,NoOp(SH-105: Incoming call to AI Financial Agent)
 same => n,Answer()
 same => n,Wait(0.2)
 same => n,AudioSocket(${UUID()},${SH105_AUDIOSOCKET_HOST}:${SH105_AUDIOSOCKET_PORT})
 same => n,Hangup()

; ── Catch-all for other extensions ───────────────────────────────────
exten => _X.,1,NoOp(Unknown extension ${EXTEN})
 same => n,Hangup()
