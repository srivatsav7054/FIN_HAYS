; =====================================================================
; SH-105 — PJSIP Configuration for Asterisk
; =====================================================================
; Defines SIP endpoints for softphone registration.
; Place this file at /etc/asterisk/pjsip.conf
; =====================================================================

; ── Transport (UDP on port 5060) ─────────────────────────────────────
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Only the container's own loopback is "local". Everything else
; (including 172.17.0.1 Docker gateway where Linphone packets arrive)
; is external, so Asterisk will use external_media_address in the SDP.
local_net=127.0.0.1/32
external_media_address=192.168.137.52
external_signaling_address=192.168.137.52

; ── User 1001 (primary test softphone) ───────────────────────────────
[1001]
type=endpoint
context=sh105
transport=transport-udp
disallow=all
allow=ulaw,alaw
auth=1001-auth
aors=1001
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
media_use_received_transport=yes
media_encryption=sdes
media_encryption_optimistic=yes
media_address=192.168.137.52

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=sh105pass

[1001]
type=aor
max_contacts=5
remove_existing=yes

; ── User 1002 (secondary test softphone) ─────────────────────────────
[1002]
type=endpoint
context=sh105
transport=transport-udp
disallow=all
allow=ulaw,alaw
auth=1002-auth
aors=1002
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
media_use_received_transport=yes
media_encryption=sdes
media_encryption_optimistic=yes
media_address=192.168.137.52

[1002-auth]
type=auth
auth_type=userpass
username=1002
password=sh105pass

[1002]
type=aor
max_contacts=5
remove_existing=yes
